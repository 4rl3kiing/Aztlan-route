[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aztlan-route"
version = "0.1.0"
description = "Local-first desktop shell for managing permitted AI provider browser sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "playwright>=1.45,<2", "platformdirs>=4.2,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "pytest-qt>=4.4,<5", "ruff>=0.5,<1"]

[project.scripts]
aztlan-route = "aztlan_route.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aztlan_route"]

[tool.hatch.build.targets.wheel.force-include]
"src/aztlan_route/providers.json" = "aztlan_route/providers.json"
"src/aztlan_route/api_providers.json" = "aztlan_route/api_providers.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI deterministic across Ruff releases; this is Ruff's stable default error set.
select = ["E4", "E7", "E9", "F"]
