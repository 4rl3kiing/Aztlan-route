name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libfontconfig1
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Run Ruff
        run: python -m ruff check src tests
      - name: Validate Debian installer syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/install-debian.sh scripts/uninstall-debian.sh
      - name: Run tests
        run: python -m pytest

  debian-12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile, lint and test inside Debian 12
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace debian:12 bash -euxo pipefail -c '
            apt-get update
            apt-get install -y python3 python3-venv python3-pip libglib2.0-0 libnss3 libnspr4 libdbus-1-3 libfontconfig1 libgl1 libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xfixes0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libx11-xcb1 libxrender1 libxi6 libxext6 libsm6 libice6 libasound2
            python3 -m venv /tmp/aztlan-venv
            /tmp/aztlan-venv/bin/python -m pip install --upgrade pip
            /tmp/aztlan-venv/bin/python -m pip install -e ".[dev]"
            /tmp/aztlan-venv/bin/python -m compileall -q src tests
            /tmp/aztlan-venv/bin/python -m ruff check src tests
            /tmp/aztlan-venv/bin/python -m pytest
            bash -n scripts/install-debian.sh scripts/uninstall-debian.sh
          '

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium and Firefox
        run: python -m playwright install --with-deps chromium firefox
      - name: Exercise real persistent browser profiles
        run: python -m pytest tests/test_browser_integration.py
